<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Страница оформления заявки на товар учебного интернет-магазина.">
  <title>Заказ — ShopProject</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="top">
  <header class="site-header">
    <div class="site-header__inner container">
      <a class="site-header__logo" href="index.html">ShopProject</a>

      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item">
            <a class="site-nav__link" href="index.html">Главная</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="catalog.html">Каталог</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="product.html">Товар</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link site-nav__link--active" href="order.html">Заказ</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="contacts.html">Контакты</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="index.html#advantages">Преимущества</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="index.html#popular">Популярные товары</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <nav class="breadcrumbs container" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <a class="breadcrumbs__link" href="product.html">Товар</a>
      <span class="breadcrumbs__current">Заказ</span>
    </nav>

    <section class="page-intro container">
      <p class="page-intro__eyebrow">Заявка</p>
      <h1 class="page-intro__title">Оформление заказа</h1>
      <p class="page-intro__text">
        Заполните форму. Обязательные поля отмечены средствами HTML-валидации.
      </p>
    </section>

    <section class="section container">
      <form class="order-form order-form--page" action="#" method="post">
        <div class="order-form__field">
          <label class="order-form__label" for="page-order-name">Имя</label>
          <input class="order-form__input" id="page-order-name" name="name" type="text" minlength="2" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-order-email">E-mail</label>
          <input class="order-form__input" id="page-order-email" name="email" type="email" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-order-phone">Телефон</label>
          <input
            class="order-form__input"
            id="page-order-phone"
            name="phone"
            type="tel"
            placeholder="+7 (900) 000-00-00"
            pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$"
            required
          >
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-order-product">Товар</label>
          <select class="order-form__select" id="page-order-product" name="product" required>
            <option value="">Выберите товар</option>
            <option value="Товар 1">Товар 1 — 1000 руб.</option>
            <option value="Товар 2">Товар 2 — 1500 руб.</option>
            <option value="Товар 3">Товар 3 — 2000 руб.</option>
          </select>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-order-comment">Комментарий</label>
          <textarea
            class="order-form__textarea"
            id="page-order-comment"
            name="comment"
            rows="5"
            placeholder="Например: удобное время для связи"
          ></textarea>
        </div>

        <div class="order-form__field order-form__field--checkbox">
          <label class="order-form__checkbox">
            <input class="order-form__checkbox-control" name="agreement" type="checkbox" required>
            <span class="order-form__checkbox-text">Я согласен на обработку данных</span>
          </label>
        </div>

        <div class="order-form__actions">
          <a class="button button--secondary" href="product.html">Вернуться к товару</a>
          <button class="button button--primary" type="submit">Отправить заявку</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner container">
      <p class="site-footer__text">&copy; 2026 Учебный проект.</p>
      <a class="site-footer__link" href="contacts.html">Контакты</a>
    </div>
  </footer>

  <a class="back-to-top" href="#top" aria-label="Наверх">↑</a>
</body>
</html>
